{% extends 'store/base.html' %}
{% block title %}Password Reset Complete | MyAmazon{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-blue-50 py-12 px-4">
  <div class="max-w-md w-full text-center">

    <div class="text-7xl mb-4">✅</div>
    <h1 class="text-3xl font-bold text-black mb-6">Password Reset Complete</h1>

    <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-200">
      <p class="text-black mb-6">
        Your password has been successfully changed. You can now log in with your new password.
      </p>
      <a href="{% url 'login' %}"
         class="inline-block bg-gradient-to-r from-blue-600 to-purple-600 text-white px-8 py-3 rounded-xl font-semibold hover:from-blue-700 hover:to-purple-700 transition">
        🚀 Log In Now
      </a>
    </div>

  </div>
</div>
{% endblock %}
