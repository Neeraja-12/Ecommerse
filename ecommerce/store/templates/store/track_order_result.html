{% extends 'store/base.html' %}
{% block content %}
<div class="container mx-auto py-10 text-center">
  <h1 class="text-2xl font-semibold text-gray-700">{{ message }}</h1>
  {% if order %}
    <p class="mt-3 text-gray-600">Tracking number: {{ order.tracking_number|default:"Not assigned yet" }}</p>
  {% endif %}
  <a href="{% url 'track_order_by_number' %}" class="inline-block mt-6 text-blue-600 hover:underline">Track another order</a>
</div>
{% endblock %}
