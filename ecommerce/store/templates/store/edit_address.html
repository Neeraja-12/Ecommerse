{% extends 'store/base.html' %}
{% block title %}Edit Address | MyAmazon{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-10">
  <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Edit Address</h1>

  <div class="max-w-lg mx-auto bg-white p-6 rounded-2xl shadow-md">
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full mt-4 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition font-semibold">
        Save Changes
      </button>
    </form>
  </div>
</div>
{% endblock %}
