{% extends 'store/base.html' %}
{% block title %}Subscribe | MyAmazon{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-10">
  <div class="max-w-lg mx-auto bg-white p-8 rounded-2xl shadow-lg text-center">
    <h1 class="text-3xl font-bold text-gray-800 mb-4">📰 Subscribe to Our Newsletter</h1>
    <p class="text-gray-600 mb-6">Get the latest updates, offers, and product launches straight to your inbox!</p>

    <form method="post" class="flex flex-col sm:flex-row gap-4 justify-center">
      {% csrf_token %}
      {{ form.email.errors }}
      {{ form.email }}
      <button type="submit"
              class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
        Subscribe
      </button>
    </form>
  </div>
</div>
{% endblock %}
