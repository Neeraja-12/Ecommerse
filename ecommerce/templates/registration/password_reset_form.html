{% extends 'store/base.html' %}
{% block title %}Reset Password | MyAmazon{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-purple-50 py-12 px-4">
  <div class="max-w-md w-full">

    <div class="text-center mb-8">
      <div class="text-6xl mb-4">🔑</div>
      <h1 class="text-3xl font-bold text-black mb-2">Forgot Password?</h1>
      <p class="text-black">Enter your email and we'll send you a reset link.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-200">
      <form method="post" class="space-y-5">
        {% csrf_token %}

        <div>
          <label for="id_email" class="block text-sm font-semibold text-black mb-2">📧 Email Address</label>
          <input type="email" name="email" id="id_email" required
                 placeholder="your@email.com"
                 class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-black bg-white">
        </div>

        <button type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-4 rounded-xl font-bold text-lg hover:from-blue-700 hover:to-purple-700 transition shadow-lg hover:shadow-xl">
          📨 Send Reset Link
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="{% url 'login' %}" class="text-sm text-blue-600 hover:underline font-semibold">
          ← Back to Login
        </a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
