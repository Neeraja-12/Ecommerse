{% extends 'store/base.html' %}
{% block title %}Delete Address | MyAmazon{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-10">
  <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Delete Address</h1>

  <div class="max-w-lg mx-auto bg-white p-6 rounded-2xl shadow-md text-center">
    <p class="mb-6">Are you sure you want to delete the address for <strong>{{ address.full_name }}</strong>?</p>
    <form method="POST">
      {% csrf_token %}
      <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition mr-2">Yes, Delete</button>
      <a href="{% url 'checkout' %}" class="bg-gray-300 text-gray-800 px-6 py-2 rounded-lg hover:bg-gray-400 transition">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
