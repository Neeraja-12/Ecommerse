{% extends 'store/base.html' %}

{% block title %}Add Address | MyAmazon{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-10 max-w-2xl">
  <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Add Address</h1>
  <form method="post" class="bg-white p-6 rounded-2xl shadow-md space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-semibold">Save address</button>
  </form>
</div>
{% endblock %}
