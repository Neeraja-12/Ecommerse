{% extends "store/base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold mb-4">Reset your password</h2>
  <p class="text-gray-600 mb-4">Enter your email and we'll send you a reset link.</p>
  <form method="post">
    {% csrf_token %}
    <label class="block mb-2 text-sm font-medium">Email</label>
    <input type="email" name="email" required class="w-full border rounded px-3 py-2 mb-4" />
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
      Send reset link
    </button>
  </form>
  <a href="{% url 'login' %}" class="block mt-4 text-sm text-blue-600">← Back to login</a>
</div>
{% endblock %}
