{% extends "store/base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold mb-4">Set new password</h2>
  {% if validlink %}
  <form method="post">
    {% csrf_token %}
    <label class="block mb-2 text-sm font-medium">New password</label>
    <input type="password" name="new_password1" required class="w-full border rounded px-3 py-2 mb-3" />
    <label class="block mb-2 text-sm font-medium">Confirm new password</label>
    <input type="password" name="new_password2" required class="w-full border rounded px-3 py-2 mb-4" />
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
      Change my password
    </button>
  </form>
  {% else %}
  <p class="text-red-600">This reset link is invalid or has expired. Please request a new one.</p>
  <a href="{% url 'password_reset' %}" class="block mt-4 text-sm text-blue-600">Try again</a>
  {% endif %}
</div>
{% endblock %}
